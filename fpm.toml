name        = "fordiff"
description = "A Fortran library for numerical differentiation"
version     = "VERSION"
author      = "Seyed Ali Ghasemi"
maintainer  = "info@gha3mi.com"
homepage    = "https://github.com/gha3mi/fordiff"
copyright   = "Copyright (c) 2023-2025, Seyed Ali Ghasemi"
license     = "BSD-3"

[build]
auto-executables = false
auto-tests       = false
auto-examples    = false
module-naming    = false

[install]
library = true

[fortran]
implicit-typing   = false
implicit-external = false
source-form       = "free"

[preprocess]
[preprocess.cpp]

[dependencies]
kinds       = {git="https://github.com/gha3mi/kinds.git"}
forunittest = {git="https://github.com/gha3mi/forunittest.git"}

[[test]]
name       = "test1"
source-dir = "test"
main       = "test1.f90"

[[test]]
name       = "test2"
source-dir = "test"
main       = "test2.f90"

[[test]]
name       = "test3"
source-dir = "test"
main       = "test3.f90"

[[test]]
name       = "test4"
source-dir = "test"
main       = "test4.f90"

[[test]]
name       = "test5"
source-dir = "test"
main       = "test5.f90"

[[test]]
name       = "test6"
source-dir = "test"
main       = "test6.f90"


[[example]]
name       = "demo1"
source-dir = "example"
main       = "demo1.f90"

[[example]]
name       = "demo2"
source-dir = "example"
main       = "demo2.f90"

[[example]]
name       = "demo3"
source-dir = "example"
main       = "demo3.f90"



[extra.ford]
project             = "ForDiff"
year                = "2023-2025"
project_github      = "https://github.com/gha3mi/fordiff"
author              = "Seyed Ali Ghasemi"
email               = "info@gha3mi.com"
github              = "https://github.com/gha3mi"
license             = "BSD 3-Clause"
src_dir             = ["src", "example", "test"]
output_dir          = "doc"
source              = true
incl_src            = true
graph               = true
coloured_edges      = true
search              = true
print_creation_date = true
sort                = "permission-alpha"
display             = ["public", "private", "protected"]


[extra.fortitude.check]
ignore = ["C131", "C003"]