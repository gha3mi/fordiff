name       = "fordiff"
version    = "0.1.1"
author     = "Seyed Ali Ghasemi"
maintainer = "info@gha3mi.com"
copyright  = "Copyright (c) 2023, Seyed Ali Ghasemi"
license    = "BSD-3"

[build]
auto-executables = false
auto-tests       = false
auto-examples    = false
module-naming    = false

[install]
library = true

[fortran]
implicit-typing   = false
implicit-external = false
source-form       = "free"

[dependencies]
kinds       = {git="https://github.com/gha3mi/kinds.git"}
forunittest = {git="https://github.com/gha3mi/forunittest.git"}

[[test]]
name       = "test1"
source-dir = "test"
main       = "test1.f90"

[[test]]
name       = "test2"
source-dir = "test"
main       = "test2.f90"

[[test]]
name       = "test3"
source-dir = "test"
main       = "test3.f90"

[[test]]
name       = "test4"
source-dir = "test"
main       = "test4.f90"

[[test]]
name       = "test5"
source-dir = "test"
main       = "test5.f90"

[[test]]
name       = "test6"
source-dir = "test"
main       = "test6.f90"


[[example]]
name       = "demo1"
